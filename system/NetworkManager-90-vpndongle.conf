# /etc/NetworkManager/conf.d/90-vpndongle.conf
# usb0 gehört dem VPN-Dongle (statische IP + eigene dnsmasq), nicht NM.
# NM schreibt die Upstream-DNS nach /run/NetworkManager/resolv.conf.
[main]
dns=default

[keyfile]
unmanaged-devices=interface-name:usb0

# Das Basis-Image bringt eine feste WLAN-MAC mit (in allen Sticks gleich).
# "stable": eigene MAC je Gerät (machine-id) und Profil, über Neustarts gleich
# -> gleiche DHCP-Adresse, keine Kollision zwischen zwei Sticks im selben WLAN.
[connection-wifi-stable-mac]
match-device=type:wifi
wifi.cloned-mac-address=stable
