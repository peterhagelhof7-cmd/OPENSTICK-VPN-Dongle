# /etc/systemd/journald.conf.d/90-vpndongle.conf
# Journal begrenzen: schont den eMMC und verhindert, dass Logs den Flash füllen.
# Persistent (statt nur im RAM), damit Fehler über einen Neustart hinweg
# nachvollziehbar bleiben – wichtig bei der Inbetriebnahme.
[Journal]
Storage=persistent
SystemMaxUse=50M
SystemKeepFree=300M
SystemMaxFileSize=10M
RuntimeMaxUse=16M
MaxRetentionSec=1month
# Schreibvorgänge bündeln (= Standard; Meldungen ab CRIT schreibt journald sofort)
SyncIntervalSec=5m
