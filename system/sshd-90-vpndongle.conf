# /etc/ssh/sshd_config.d/90-vpndongle.conf
# Erreichbarkeit regelt die Firewall von vpndongled: Port 22 nur über USB
# (usb0) und den WireGuard-Tunnel (wg0); nur wenn das USB-Netz fehlt, als
# Notzugang auch über WLAN/LTE. Debian liest Drop-ins vor der Hauptkonfig,
# der erste Wert gewinnt.
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 4
LoginGraceTime 30
X11Forwarding no
